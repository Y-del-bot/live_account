<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>直播销售明细</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h3>直播场次销售明细</h3>
    {% if live %}
    <p>📅 {{live[1]}} | 🏠 {{live[2]}} | 🧑 {{live[4]}}</p>
    {% endif %}
    <div class="alert alert-success">本场销售额合计：<strong>{{sum_money}}</strong> 元</div>
    <a href="{{url_for('add_sale', live_id=live[0])}}" class="btn btn-primary mb-3">新增销售记录</a>
    <table class="table table-bordered">
        <tr>
            <th>ID</th>
            <th>商品名称</th>
            <th>规格</th>
            <th>单价</th>
            <th>成交数量</th>
            <th>销售额</th>
            <th>操作</th>
        </tr>
        {% for row in sale_list %}
        <tr>
            <td>{{row[0]}}</td>
            <td>{{row[2]}}</td>
            <td>{{row[3]}}</td>
            <td>{{row[4]}}</td>
            <td>{{row[5]}}</td>
            <td>{{row[6]}}</td>
            <td><a href="{{url_for('delete_sale', sale_id=row[0])}}" class="btn btn-sm btn-danger" onclick="return confirm('确定删除这条销售记录吗？')">删除</a></td>
        </tr>
        {% endfor %}
    </table>
    <a href="{{url_for('index')}}" class="btn btn-secondary">返回首页</a>
</body>
</html>
