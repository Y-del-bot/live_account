<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='90' font-size='90'>📊</text></svg>">
    <meta charset="UTF-8">
    <title>农特产品直播带货复盘台账管理工具</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2>农特产品直播带货复盘台账管理工具</h2>
    <div class="my-3">
        <a href="{{url_for('add_live')}}" class="btn btn-primary">新增直播场次</a>
        <a href="{{url_for('stat')}}" class="btn btn-success">销量统计</a>
        <a href="{{url_for('export')}}" class="btn btn-warning">导出复盘Excel报表</a>
        <a href="{{url_for('recycle')}}" class="btn btn-secondary">🗑️回收站</a>
    </div>

    <!-- ============ 新增顶部筛选区域 ============ -->
    <div class="card p-3 mb-4 bg-light">
        <h5>筛选直播场次</h5>
        <form method="get" action="{{url_for('index')}}" class="row g-3 align-items-end">
            <div class="col-auto">
                <label class="form-label">直播开始时间</label>
                <input type="date" class="form-control" name="start_time" value="{{start_time}}">
            </div>
            <div class="col-auto">
                <label class="form-label">直播结束时间</label>
                <input type="date" class="form-control" name="end_time" value="{{end_time}}">
            </div>
            <div class="col-auto">
                <label class="form-label">农产品品类</label>
                <select class="form-select" name="category">
                    <option value="">全部品类</option>
                    {% for cate in category_list %}
                        <option value="{{cate}}" {% if cate == category %}selected{% endif %}>{{cate}}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">筛选</button>
                <a href="{{url_for('index')}}" class="btn btn-outline-secondary">重置</a>
            </div>
        </form>
    </div>

    <div class="alert alert-info">📊 当日总销售额：<strong>{{today_total_money}}</strong> 元</div>
    <h4>已录入直播场次</h4>
    <table class="table table-bordered">
        <tr>
            <th>ID</th>
            <th>直播时间</th>
            <th>直播间</th>
            <th>品类</th>
            <th>主播</th>
            <th>备注</th>
            <th>操作</th>
        </tr>
        {% for item in live_list %}
        <tr>
            <td>{{item[0]}}</td>
            <td>{{item[1]}}</td>
            <td>{{item[2]}}</td>
            <td>{{item[3]}}</td>
            <td>{{item[4]}}</td>
            <td>{{item[5]}}</td>
            <td>
                <a href="{{url_for('live_detail', live_id=item[0])}}" class="btn btn-sm btn-info">查看销售明细</a>
                <a href="{{url_for('add_sale', live_id=item[0])}}" class="btn btn-sm btn-primary">登记销售</a>
                <a href="{{url_for('soft_delete_live', live_id=item[0])}}" class="btn btn-sm btn-danger" onclick="return confirm('确定移入回收站？移入后首页隐藏，可去回收站恢复！')">移入回收站</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
