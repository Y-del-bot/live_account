<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>基础销量统计</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h3>农产品销量汇总统计</h3>
    <div class="alert alert-info">当日总销售额：<strong>{{today_total_money}}</strong> 元</div>
    <div class="alert alert-success">全部累计总销售额：<strong>{{all_total}}</strong> 元</div>
    <table class="table table-bordered">
        <tr>
            <th>商品名称</th>
            <th>总成交数量</th>
            <th>总销售额</th>
        </tr>
        {% for row in stat_list %}
        <tr>
            <td>{{row[0]}}</td>
            <td>{{row[1]}}</td>
            <td>{{row[2]}}</td>
        </tr>
        {% endfor %}
    </table>
    <a href="{{url_for('index')}}" class="btn btn-secondary">返回首页</a>
</body>
</html>
