<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登记销售台账</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h3>登记本场直播销售台账</h3>
    <form method="post">
        <div class="mb-2">商品名称：<input class="form-control" name="goods_name" required></div>
        <div class="mb-2">产品规格：<input class="form-control" name="spec"></div>
        <div class="mb-2">单价：<input class="form-control" type="number" step="0.01" name="price" required></div>
        <div class="mb-2">成交数量：<input class="form-control" type="number" name="num" required></div>
        <button type="submit" class="btn btn-primary">保存台账记录</button>
        <a href="{{url_for('index')}}" class="btn btn-secondary">返回首页</a>
    </form>
</body>
</html>
